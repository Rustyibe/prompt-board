[package]
name = "prompt-board"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
colored = "3.1.1"
dialoguer = "0.12.0"
directories = "6.0.0"
nanoid = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-width = "0.2.2"
which = "8.0.6"
